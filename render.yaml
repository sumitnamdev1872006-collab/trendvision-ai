services:
  - type: web
    name: trendvision-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_PATH
        value: /tmp/trendvision.db
